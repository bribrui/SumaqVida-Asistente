<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Mi Perfil - SumaqVida</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .perfil-container { max-width: 500px; margin: 40px auto; background: #fff; border-radius: 12px; box-shadow: 0 4px 16px #0001; padding: 32px 24px; }
    .perfil-container h2 { color: #e0356d; margin-bottom: 18px; }
    .perfil-dato { margin-bottom: 16px; font-size: 1.1em; }
    .perfil-label { color: #888; font-weight: 500; margin-right: 8px; }
    .perfil-edit { margin-top: 24px; padding-top: 16px; border-top: 1px solid #eee; }
    .perfil-edit label { display: block; margin-bottom: 4px; color: #555; }
    .perfil-edit input { width: 100%; padding: 8px; margin-bottom: 12px; border-radius: 6px; border: 1px solid #ccc; }
    .perfil-edit button { background: #e0356d; color: #fff; border: none; border-radius: 6px; padding: 8px 18px; font-weight: 600; cursor: pointer; }
    .perfil-edit button:hover { background: #c02d5a; }
    .perfil-msg { margin-bottom: 10px; color: #e0356d; font-size: 1em; }
    .perfil-historial { margin-top: 32px; }
    .perfil-historial table { width: 100%; border-collapse: collapse; }
    .perfil-historial th, .perfil-historial td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    .perfil-historial th { background: #f3f3f3; }
  </style>
</head>
<body>
  <div class="perfil-container">
    <h2>Mi Perfil</h2>
    <div id="perfilDatos">Cargando datos de tu perfil...</div>
    <div class="perfil-edit">
      <h3>Editar datos personales</h3>
      <div id="perfilMsg" class="perfil-msg"></div>
      <form id="perfilForm">
        <label for="peso">Peso (kg):</label>
        <input type="number" id="peso" name="peso" min="20" max="300" step="0.1" required />
        <label for="talla">Talla (cm):</label>
        <input type="number" id="talla" name="talla" min="80" max="250" step="0.1" required />
        <button type="submit">Guardar cambios</button>
      </form>
    </div>
    <div class="perfil-historial">
      <h3>Últimos registros diarios</h3>
      <table>
        <thead>
          <tr><th>Fecha</th><th>Glucosa</th><th>Observaciones</th></tr>
        </thead>
        <tbody id="tablaRegistrosPerfil">
          <tr><td colspan="3">Cargando...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
  <script>
    let datosPerfil = {};
    fetch('/Sumaqvida/api/usuario_perfil.php')
      .then(res => res.json())
      .then(data => {
        const cont = document.getElementById('perfilDatos');
        if (data.success) {
          datosPerfil = data;
          cont.innerHTML = `
            <div class="perfil-dato"><span class="perfil-label">Nombre:</span> ${data.nombre}</div>
            <div class="perfil-dato"><span class="perfil-label">Usuario:</span> ${data.usuario}</div>
            <div class="perfil-dato"><span class="perfil-label">Correo:</span> ${data.email}</div>
            <div class="perfil-dato"><span class="perfil-label">Fecha de registro:</span> ${data.fecha_registro}</div>
            <div class="perfil-dato"><span class="perfil-label">Peso:</span> <span id="pesoShow">${data.peso ?? '-'}</span> kg</div>
            <div class="perfil-dato"><span class="perfil-label">Talla:</span> <span id="tallaShow">${data.talla ?? '-'}</span> cm</div>
          `;
          document.getElementById('peso').value = data.peso ?? '';
          document.getElementById('talla').value = data.talla ?? '';
        } else {
          cont.innerHTML = '<span style="color:#e0356d">Debes iniciar sesión para ver tu perfil.</span>';
          document.getElementById('perfilForm').style.display = 'none';
        }
      });
    document.getElementById('perfilForm').onsubmit = function(e) {
      e.preventDefault();
      const peso = document.getElementById('peso').value;
      const talla = document.getElementById('talla').value;
      const msg = document.getElementById('perfilMsg');
      const formData = new FormData();
      formData.append('peso', peso);
      formData.append('talla', talla);
      fetch('/Sumaqvida/api/actualizar_perfil.php', {
        method: 'POST',
        body: formData
      })
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          msg.textContent = 'Datos actualizados correctamente.';
          document.getElementById('pesoShow').textContent = peso;
          document.getElementById('tallaShow').textContent = talla;
        } else {
          msg.textContent = 'Error: ' + (data.error || 'No se pudo actualizar');
        }
      });
    };
    // Mostrar últimos registros diarios
    fetch('/Sumaqvida/api/obtener_registros_diarios.php')
      .then(res => res.json())
      .then(data => {
        const tbody = document.getElementById('tablaRegistrosPerfil');
        if (data.success && data.registros.length > 0) {
          tbody.innerHTML = data.registros.map(r =>
            `<tr><td>${r.fecha}</td><td>${r.glucosa} mg/dL</td><td>${r.observaciones || ''}</td></tr>`
          ).join('');
        } else {
          tbody.innerHTML = '<tr><td colspan="3">No hay registros.</td></tr>';
        }
      });
  </script>
</body>
</html>
