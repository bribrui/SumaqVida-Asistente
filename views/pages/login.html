<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar Sesión - SugarTrack</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/app.js"></script>
  <style>
    .login-container {
      max-width: 400px;
      margin: 100px auto;
      background-color: white;
      padding: 30px 25px;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
    }

    .login-container h2 {
      text-align: center;
      margin-bottom: 25px;
      color: var(--color-principal);
      font-size: 1.8rem;
    }

    .login-container label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      color: var(--color-oscuro);
    }

    .login-container input {
      width: 100%;
      padding: 12px;
      margin-bottom: 18px;
      border-radius: 8px;
      border: 1px solid #ccc;
      outline: none;
      transition: border-color 0.3s;
    }

    .login-container input:focus {
      border-color: var(--color-principal);
    }

    .login-container button {
      width: 100%;
      padding: 12px;
      background-color: var(--color-principal);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .login-container button:hover {
      background-color: #e0356d;
    }

    .login-container .extra {
      text-align: center;
      margin-top: 15px;
      font-size: 0.9rem;
    }

    .login-container .extra a {
      color: var(--color-principal);
      text-decoration: none;
      font-weight: 500;
    }

    body {
      background: linear-gradient(to bottom right, #fdfdfd, #f3f8fc);
    }
  </style>
</head>
<body>
  <div id="include-header"></div>
  <div class="login-container">
    <h2>Iniciar Sesión</h2>
    <form id="loginForm">
      <label for="usuario">Usuario o correo</label>
      <input type="text" id="usuario" name="usuario" placeholder="Usuario o correo" required />
      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password" placeholder="••••••••" required />
      <button type="submit">Entrar</button>
    </form>
    <div class="extra">
      ¿No tienes cuenta? <a href="/views/pages/registrate.html">Regístrate</a>
    </div>
  </div>
  <script>
    document.getElementById('loginForm').onsubmit = function(e) {
      e.preventDefault();
      const usuario = document.getElementById('usuario').value.trim();
      const password = document.getElementById('password').value;
      const formData = new FormData();
      formData.append('usuario', usuario);
      formData.append('password', password);
      fetch('/Sumaqvida/api/login_usuario.php', {
        method: 'POST',
        body: formData
      })
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          alert('¡Bienvenido, ' + data.nombre + '!');
          window.location.href = '/Sumaqvida/views/pages/panel.html';
        } else {
          alert('Error: ' + (data.error || 'No se pudo iniciar sesión'));
        }
      });
    };
  </script>
</body>
</html>
