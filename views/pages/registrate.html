<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crear Cuenta - SugarTrack</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/app.js"></script>
  <style>
    .register-container {
      max-width: 420px;
      margin: 100px auto;
      background-color: white;
      padding: 35px 28px;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
    }

    .register-container h2 {
      text-align: center;
      margin-bottom: 25px;
      color: var(--color-principal);
      font-size: 1.8rem;
    }

    .register-container label {
      display: block;
      margin-bottom: 6px;
      font-weight: 500;
      color: var(--color-oscuro);
    }

    .register-container input {
      width: 100%;
      padding: 12px;
      margin-bottom: 18px;  
      border-radius: 8px;
      border: 1px solid #ccc;
      outline: none;
      transition: border-color 0.3s;
    }

    .register-container input:focus {
      border-color: var(--color-principal);
    }

    .register-container button {
      width: 100%;
      padding: 12px;
      background-color: var(--color-principal);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .register-container button:hover {
      background-color: #e0356d;
    }

    .register-container .extra {
      text-align: center;
      margin-top: 15px;
      font-size: 0.9rem;
    }

    .register-container .extra a {
      color: var(--color-principal);
      text-decoration: none;
      font-weight: 500;
    }

    body {
      background: linear-gradient(to bottom right, #fdfdfd, #f3f8fc);
    }
  </style>
</head>
<body>

  <div id="include-header"></div>

  <div class="register-container">
    <h2>Crear Cuenta</h2>
    <form id="registroForm">
      <label for="nombre">Nombre completo</label>
      <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required />

      <label for="usuario">Nombre de usuario</label>
      <input type="text" id="usuario" name="usuario" placeholder="Tu usuario" required />

      <label for="email">Correo electrónico</label>
      <input type="email" id="email" name="email" placeholder="tucorreo@ejemplo.com" required />

      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password" placeholder="••••••••" required />

      <label for="confirmar">Confirmar contraseña</label>
      <input type="password" id="confirmar" name="confirmar" placeholder="Repite tu contraseña" required />

      <button type="submit">Registrarme</button>
    </form>
    <div class="extra">
      ¿Ya tienes cuenta? <a href="/views/pages/login.html">Inicia sesión</a>
    </div>
  </div>

  <script>
    document.getElementById('registroForm').onsubmit = function(e) {
      e.preventDefault();
      const nombre = document.getElementById('nombre').value.trim();
      const usuario = document.getElementById('usuario').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirmar = document.getElementById('confirmar').value;

      if (password !== confirmar) {
        alert('Las contraseñas no coinciden');
        return;
      }

      if (!nombre || !usuario || !email || !password) {
        alert('Por favor, completa todos los campos.');
        return;
      }

      const formData = new FormData();
      formData.append('nombre', nombre);
      formData.append('usuario', usuario);
      formData.append('email', email);
      formData.append('password', password);

      fetch('/Sumaqvida/api/registrar_usuario.php', {
        method: 'POST',
        body: formData
      })
      .then(res => res.json())
      .then(data => {
        console.log(data); // Para depuración
        if (data.success) {
          alert('¡Registro exitoso!');
          window.location.href = '/Sumaqvida/views/pages/login.html';
        } else {
          alert('Error: ' + (data.error || 'No se pudo registrar'));
        }
      });
    };
  </script>
</body>
</html>
